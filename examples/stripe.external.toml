# Servicio externo: descubierto desde su OpenAPI, congelado aqui como contrato.
# Origen: https://api.stripe.com/openapi.json
service = "stripe"
external = true

[methods."charges.create"]
idempotent = true
in = { amount = "int", currency = "string", source = "string" }
out = { id = "string", status = "string" }
