service = "payments"
owner = "payments-team"
tier = "0"
version = "1.2.0"
transport = "pubsub"

[emits."payment.captured@v1"]
paymentId = "uuid"
orderId = "uuid"
amount = "money"

# Lo que este servicio LEE del evento, declarado. No es documentacion: el
# handler generado recibe `Pick<OrderPlacedV1, ...>`, asi que leer un campo que
# no se declaro no compila, y la declaracion no puede mentir. Es lo que Pact
# consigue grabando el uso, sin grabar nada.
[consumes."order.placed@v1"]
handler = "onOrderPlaced"
uses = ["orderId", "total"]

[methods.capturePayment]
http = "POST /v1/payments"
auth = "required"
timeout_ms = 8000
idempotent = true
in = { orderId = "uuid", amount = "money" }
out = { paymentId = "uuid" }
# How it fails, declared like `in` and `out`. A declined card and an issuer that
# is down are not the same failure —one will never work, the other one will— and
# without saying so both arrive at the caller as a 500 it has to guess about.
errors = [
  { code = "card_declined", status = 402, detail = "the issuer declined the charge" },
  { code = "issuer_unavailable", status = 503, retriable = true, detail = "the issuer is not answering" },
]

[methods.refundPayment]
http = "POST /v1/payments/{paymentId}/refunds"
auth = "required"
timeout_ms = 8000
idempotent = true
in = { paymentId = "uuid" }
out = { paymentId = "uuid", status = "string" }
# The compensation's failure is retriable on purpose: there is nothing behind
# it, and the saga's three declared retries are what keep it from getting stuck.
errors = [
  { code = "refund_rejected", status = 503, retriable = true, detail = "the refund did not go through" },
]

# The payout to the merchant, which is the step that can fail after the charge
# already went through: the reason a saga exists instead of a transaction.
[methods.payoutMerchant]
http = "POST /v1/payouts"
auth = "required"
timeout_ms = 4000
idempotent = true
in = { paymentId = "uuid", amount = "money" }
out = { payoutId = "uuid" }
# The ceiling is final: the amount will not fit next time either. `retriable =
# false` is not documentation —it CHANGES the generated client, which stops
# retrying it— and what it buys is the saga's budget: the retries it does not
# spend here are the ones left to compensate with.
errors = [
  { code = "merchant_ceiling", status = 409, detail = "the payout is over the merchant's ceiling" },
  { code = "rail_busy", status = 503, retriable = true, detail = "the payout rail is saturated" },
]

[[depends]]
service = "orders"
method = "getOrder"
via = "onOrderPlaced"
timeout_ms = 1000
retries = 3
breaker = true

[[depends]]
external = "stripe"
method = "charges.create"
timeout_ms = 8000
breaker = true

# The warehouse is a platform decision: `verify` requires all three services to
# declare the same one, because a funnel split across two warehouses cannot be
# assembled with one query.
[analytics]
warehouse = "clickhouse"

[infra]
state = "postgres"
tenant_column = "tenant_id"
# `attempt` is the retry policy's attempt log: it is infrastructure, not tenant
# data. Exempt on purpose and in writing, which is the only way the RLS rule
# keeps being useful for everything else.
tenant_exempt = ["attempt"]
# Tier 0: a standby with failover, and backups separately —the standby
# replicates a delete in seconds, so it does not cover that case.
ha = true
backup_retention_days = 30
pitr = true
pool_size = 8
max_connections = 200
migrations = "sql/payments/"
runtime = "container"
min_instances = 1
secrets = ["STRIPE_API_KEY"]

[patterns]
outbox = true

[env.staging]
min_instances = 0

[env.prod]
min_instances = 3
max_instances = 40

# The only business logic worth declaring: the same in every language.
[machine.payment]
initial = "pending"
final = ["refunded", "failed"]

[machine.payment.transitions.capture]
from = ["pending"]
to = "captured"
on = "capturePayment"
emits = "payment.captured@v1"

[machine.payment.transitions.fail]
from = ["pending"]
to = "failed"
on = "capturePayment"

[machine.payment.transitions.refund]
from = ["captured"]
to = "refunded"
on = "refundPayment"
compensates = "capture"

# Object storage. `public` decides whether it carries a CDN and whether the
# bucket allows anonymous reads: both go together or neither does.
[infra.buckets.receipts]
retention_days = 2555     # 7 years, a tax requirement

[infra.buckets.assets]
public = true
cache_ttl = 86400
retention_days = 365

# Money does not tolerate a stale balance: rather than serve something out of
# date, it serves nothing.
[cap]
consistency = "strong"
on_partition = "reject"

# A gradual rollout of the new charge path, pinned by tenant: per request, the
# same payment would take one path and then the other.
[flags.charge_v2]
owner = "payments-team"
expires = "2026-12-31"
rollout = 10
sticky_by = "tenant_id"

# An emergency switch: it lives as long as Stripe does.
[flags.stripe_kill]
owner = "payments-team"
kill_switch = true

# A non-boolean flag: OpenFeature allows string, number and object, and a config
# rollout —a limit, a provider— needs exactly that.
[flags.charge_provider]
owner = "payments-team"
expires = "2027-06-30"
sticky_by = "tenant_id"
rollout = 20
default_variant = "stripe"
variants = { stripe = "stripe", adyen = "adyen" }

[flags.retry_limit]
owner = "payments-team"
kill_switch = true
default_variant = "normal"
variants = { normal = 3, degraded = 0 }

