service = "payments"
owner = "payments-team"
tier = "0"
version = "1.2.0"

# El manifiesto partido por feature. Cada entrada es un archivo o un directorio;
# un directorio son todos sus *.toml, ordenados, asi que agregar una feature es
# agregar un archivo.
include = ["payments"]

[[depends]]
service = "orders"
method = "getOrder"
via = "onOrderPlaced"
timeout_ms = 1000
retries = 3
breaker = true

[[depends]]
external = "stripe"
method = "charges.create"
timeout_ms = 8000
breaker = true

# The warehouse is a platform decision: `verify` requires all three services to
# declare the same one, because a funnel split across two warehouses cannot be
# assembled with one query.
# El catalogo de la plataforma. Un scope con un error de dedo es un 403 en
# produccion que nadie ve en una revision, y la unica forma de atraparlo antes
# es que la lista de lo que existe este en algun lado.
[api]
scopes = ["orders:read", "payments:write"]

[analytics]
warehouse = "clickhouse"
retention_days = 730

[infra]
state = "postgres"
tenant_column = "tenant_id"
# `attempt` is the retry policy's attempt log: it is infrastructure, not tenant
# data. Exempt on purpose and in writing, which is the only way the RLS rule
# keeps being useful for everything else.
tenant_exempt = ["attempt"]
# Tier 0: a standby with failover, and backups separately —the standby
# replicates a delete in seconds, so it does not cover that case.
ha = true
backup_retention_days = 30
pitr = true
pool_size = 8
max_connections = 200
migrations = "sql/payments/"
runtime = "container"
min_instances = 1
secrets = ["STRIPE_API_KEY"]

[patterns]
outbox = true

[env.staging]
min_instances = 0

[env.prod]
min_instances = 3
max_instances = 40

# Object storage. `public` decides whether it carries a CDN and whether the
# bucket allows anonymous reads: both go together or neither does.
[infra.buckets.receipts]
retention_days = 2555     # 7 years, a tax requirement

[infra.buckets.assets]
public = true
cache_ttl = 86400
retention_days = 365

# Money does not tolerate a stale balance: rather than serve something out of
# date, it serves nothing.
[cap]
consistency = "strong"
on_partition = "reject"

# A gradual rollout of the new charge path, pinned by tenant: per request, the
# same payment would take one path and then the other.
[flags.charge_v2]
owner = "payments-team"
expires = "2026-12-31"
rollout = 10
sticky_by = "tenant_id"

# An emergency switch: it lives as long as Stripe does.
[flags.stripe_kill]
owner = "payments-team"
kill_switch = true

# A non-boolean flag: OpenFeature allows string, number and object, and a config
# rollout —a limit, a provider— needs exactly that.
[flags.charge_provider]
owner = "payments-team"
expires = "2027-06-30"
sticky_by = "tenant_id"
rollout = 20
default_variant = "stripe"
variants = { stripe = "stripe", adyen = "adyen" }

[flags.retry_limit]
owner = "payments-team"
kill_switch = true
default_variant = "normal"
variants = { normal = 3, degraded = 0 }

# Como un llamante se convierte en un principal.
#
# axon no autentica a nadie ni guarda una credencial. Lo que se declara aqui es
# la FORMA que tiene que tener un token verificado, para que el `auth` del edge,
# los `scopes` del metodo y el RLS que el compilador ya genera dejen de ser tres
# esperanzas independientes que casualmente coinciden.
#
# Quien emite el token —better-auth, Auth0, Keycloak, Cognito, treinta lineas de
# jose— es un adaptador, igual que Bus, Cache u Outbox. Aqui no aparece ningun
# proveedor: los nombres de claim son toda la superficie especifica, y son datos.
[auth]
# Una lista y no un valor: lo mas frecuente en la vida de un sistema de auth es
# una migracion, y son semanas aceptando dos.
issuers   = ["https://auth.demo.mx"]
audience  = "payments"
verify    = "jwks"
jwks_uri  = "https://auth.demo.mx/.well-known/jwks.json"
# Lista cerrada: `none` no es verificacion, y un HMAC donde hay un juego de
# claves publicado deja firmar con la clave publica como si fuera el secreto.
algorithms      = ["EdDSA", "ES256"]
clock_skew_s    = 60
revocation      = "eventual"
max_token_age_s = 900
subject_claim = "sub"
tenant_claim  = "org_id"
scopes_claim  = "scope"
roles_claim   = "roles"
