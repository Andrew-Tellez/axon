service = "payments"
owner = "equipo-pagos"
tier = "0"
version = "1.2.0"
transport = "pubsub"

[emits."payment.captured@v1"]
paymentId = "uuid"
orderId = "uuid"
amount = "money"

[consumes."order.placed@v1"]
handler = "onOrderPlaced"

[methods.capturePayment]
http = "POST /v1/payments"
auth = "required"
timeout_ms = 8000
idempotent = true
in = { orderId = "uuid", amount = "money" }
out = { paymentId = "uuid" }

[methods.refundPayment]
http = "POST /v1/payments/{paymentId}/refunds"
auth = "required"
timeout_ms = 8000
idempotent = true
in = { paymentId = "uuid" }
out = { paymentId = "uuid", status = "string" }

[[depends]]
service = "orders"
method = "getOrder"
via = "onOrderPlaced"
timeout_ms = 1000
retries = 3
breaker = true

[[depends]]
external = "stripe"
method = "charges.create"
timeout_ms = 8000
breaker = true

[infra]
state = "postgres"
tenant_column = "tenant_id"
# Tier 0: standby con failover, y respaldos aparte —el standby replica un
# borrado en segundos, asi que no cubre ese caso.
ha = true
backup_retention_days = 30
pitr = true
pool_size = 8
max_connections = 200
migrations = "sql/payments/"
runtime = "container"
min_instances = 1
secrets = ["STRIPE_API_KEY"]

[patterns]
outbox = true

[env.staging]
min_instances = 0

[env.prod]
min_instances = 3
max_instances = 40

# La unica logica de negocio que vale la pena declarar: la misma en todo lenguaje.
[machine.payment]
initial = "pending"
final = ["refunded", "failed"]

[machine.payment.transitions.capture]
from = ["pending"]
to = "captured"
on = "capturePayment"
emits = "payment.captured@v1"

[machine.payment.transitions.fail]
from = ["pending"]
to = "failed"
on = "capturePayment"

[machine.payment.transitions.refund]
from = ["captured"]
to = "refunded"
on = "refundPayment"
compensates = "capture"

# Almacenamiento de objetos. `public` decide si lleva CDN y si el bucket
# admite lectura anonima: las dos cosas van juntas o ninguna.
[infra.buckets.recibos]
retention_days = 2555     # 7 anos, requisito fiscal

[infra.buckets.assets]
public = true
cache_ttl = 86400
retention_days = 365

# El dinero no admite un saldo viejo: antes de servir algo desactualizado,
# no sirve nada.
[cap]
consistency = "strong"
on_partition = "reject"

# Rollout gradual del cobro nuevo, fijado por inquilino: por peticion, el mismo
# pago tomaria un camino y despues el otro.
[flags.cobro_v2]
owner = "equipo-pagos"
expires = "2026-12-31"
rollout = 10
sticky_by = "tenant_id"

# Interruptor de emergencia: vive mientras exista Stripe.
[flags.cortar_stripe]
owner = "equipo-pagos"
kill_switch = true

# Un flag no booleano: OpenFeature admite string, numero y objeto, y un rollout
# de configuracion —un limite, un proveedor— necesita justamente eso.
[flags.proveedor_de_cobro]
owner = "equipo-pagos"
expires = "2027-06-30"
sticky_by = "tenant_id"
rollout = 20
default_variant = "stripe"
variants = { stripe = "stripe", adyen = "adyen" }

[flags.limite_de_reintentos]
owner = "equipo-pagos"
kill_switch = true
default_variant = "normal"
variants = { normal = 3, degradado = 0 }
