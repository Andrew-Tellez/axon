service = "orders"
owner = "commerce-team"
tier = "1"
pii = ["customer_email"]
version = "2.0.0"
transport = "pubsub"

[emits."order.placed@v1"]
orderId = "uuid"
customerId = "uuid"
customerEmail = "string"
total = "money"

# The tenant goes in the route, not implicitly. With the database sharded by
# `tenant_id`, a query that does not carry it can neither be routed to a node nor
# isolated from the rest: the pooler rejects it and `axon verify` does not let it
# get that far.
[methods.placeOrder]
http = "POST /v1/tenants/{tenantId}/orders"
auth = "public"          # the system's front door
rate_limit = 60          # per minute: public with no brake is an invitation
timeout_ms = 5000
idempotent = true
in = { tenantId = "uuid", customerId = "uuid", customerEmail = "string", total = "money" }
out = { orderId = "uuid" }
# The front door is where guessing costs the most: whoever integrates against
# this reads the code, not our 500s. Nothing about it is retriable —the same
# order gets rejected the same way— and the generated client of anyone who calls
# it stops spending retries on it.
errors = [
  { code = "order_rejected", status = 422, detail = "the order does not pass the rules" },
]

# Dos versiones del MISMO endpoint, y la vieja declara que se esta muriendo.
# `deprecated` y `sunset` viajan en la respuesta —RFC 9745 y 8594— y el
# `successor` sale como un Link, asi que quien la llama se entera desde donde la
# llama y no desde un anuncio que no leyo.
[methods.getOrder]
http = "GET /v1/tenants/{tenantId}/orders/{orderId}"
auth = "required"
scopes = ["orders:read"]
timeout_ms = 2000
in = { tenantId = "uuid", orderId = "uuid" }
out = { orderId = "uuid", status = "string", total = "money" }
deprecated = "2026-09-01"
sunset = "2027-12-31"
successor = "getOrderV2"

# La v2 devuelve el cliente, que es lo que la v1 no daba y obligaba a una
# segunda llamada.
[methods.getOrderV2]
http = "GET /v2/tenants/{tenantId}/orders/{orderId}"
auth = "required"
scopes = ["orders:read"]
# El requisito por endpoint: QUIEN puede entrar y con que derecho contratado.
# Los nombres se comprueban contra los catalogos de arriba.
roles = ["admin", "support"]
plans = ["free", "pro"]
timeout_ms = 2000
in = { tenantId = "uuid", orderId = "uuid" }
out = { orderId = "uuid", status = "string", total = "money", customerId = "uuid" }

[[depends]]
service = "payments"
method = "capturePayment"
timeout_ms = 3000
retries = 2
breaker = true

# A warehouse is where personal data lives longest and is read by the most
# people, so the default is not to export it. Here the choice is to hash it, so
# unique customers can be counted without storing the address.
# El catalogo de la plataforma. Un scope con un error de dedo es un 403 en
# produccion que nadie ve en una revision, y la unica forma de atraparlo antes
# es que la lista de lo que existe este en algun lado.
[api]
scopes = ["orders:read", "payments:write"]

[analytics]
# ClickHouse: the only warehouse with an ingest path on the local target, and
# `axon infra` refuses the combination that has none.
warehouse = "clickhouse"
pii = "hash"
# Una tabla de eventos crece para siempre, y el primer sintoma es la factura
# mientras el segundo es una consulta que se cae. Dos anios cubren la ventana de
# cualquier metrica declarada y la comparacion contra el anio anterior.
retention_days = 730

# La excepcion, por evento: siete anios porque lo dice el SAT, no porque lo
# quiera un tablero.
[analytics.retention]
"order.placed@v1" = 2555

[infra]
state = "postgres"
tenant_column = "tenant_id"
backup_retention_days = 14
pool_size = 4
max_connections = 100
# The replicas are read from, they lag, and that is why this service declares
# itself `eventual`: the guarantee and the topology say the same thing.
read_replicas = 2
shard_key = "tenant_id"
migrations = "sql/orders/"
runtime = "container"

[env.staging]
min_instances = 0

[env.prod]
min_instances = 2

# An order catalogue can take a few seconds of lag; going down, it cannot.
[cap]
consistency = "eventual"
on_partition = "degrade"
max_staleness_ms = 3000

# The sharder goes here and not in payments: sharding with two-phase commit
# gives eventual consistency, and payments declares `strong`, tier 0 and PITR
# —three reasons `verify` rejects it there. Money is not sharded; a catalogue is.
#
# `mode = "transaction"` forces declaring how the tenant is pinned: in that mode
# the connection goes back to the pool at every COMMIT and is handed to another
# one, and a session GUC that survives returns the previous tenant's rows without
# raising an error.
[pooler]
engine = "pgdog"
mode = "transaction"
tenant_binding = "set_local"
shards = 4
max_client_conn = 500
pool_size = 40

# Business metrics. The funnel already answers conversion and business latency,
# because both are derivable from the causal chain; these two are not: somebody
# has to say which field, grouped by what, in which bucket. Declared here they
# end up as views next to the funnels instead of a query pasted into a dashboard.
# Una palanca de negocio, no de infraestructura: es lo que una regla puede
# PROPONER mover cuando el GMV cae. Vive aca y no en el codigo porque la
# variante que esta puesta la decide alguien, y una regla solo propone.
[flags.free_shipping]
owner = "orders-team"
expires = "2027-06-30"
default_variant = "off"
variants = { off = 0, over_500 = 50000 }

[metrics.orders_placed]
on     = ["order.placed@v1"]
kind   = "count"
window = "1d"

# `total` is `money`, so what gets added up is its amount column: the manifest
# keeps talking about the field the contract declares.
# El mismo conteo pero por moneda: una guarda tiene que mirar la MISMA serie
# que el disparador, o compara el numero de un segmento contra el de otro.
[metrics.orders_by_currency]
on     = ["order.placed@v1"]
kind   = "count"
by     = ["total.currency"]
window = "1d"

[metrics.gmv]
on     = ["order.placed@v1"]
kind   = "sum"
field  = "total"
by     = ["total.currency"]
window = "1d"

# La regla: el lazo que hoy vive en una alerta de dashboard mas un runbook que
# nadie corrio. La metrica ya esta declarada y el flag tambien, asi que lo que
# faltaba era decir en voz alta que condicion sobre que metrica lleva a cual.
#
# `where` fija el segmento: `gmv` agrupa por moneda, asi que es una serie por
# moneda y sin fijarla la regla compararia el numero de una contra el de otra.
# Es tambien como se declara "esta regla solo aplica a este tipo de cliente":
# la dimension viaja EN el evento.
#
# Y solo PROPONE. Nada de esto escribe en produccion: el valor es que la
# decision deja de ser oral.
[rules.gmv_usd_cayendo]
metric = "gmv"
where = { "total.currency" = "USD" }
compare = "previous"
below = 0.85              # 15% abajo de la ventana anterior
for = 2                   # dos dias seguidos: un dia malo no es una tendencia
cooldown = 3              # y tres dias tranquilos antes, o no propone
# El lazo cerrado: la regla mueve la palanca por su cuenta. Sigue haciendo falta
# que alguien corra `axon rules --apply`, y cada cambio queda en la auditoria:
# un cambio automatico en produccion que no deja rastro es la peor version de
# esto.
mode = "apply"

# La guarda: la otra direccion, declarada. Con una sola metrica esto seria la
# ley de Goodhart con un cron —la palanca mueve el numero por el que se la
# juzga y nadie mira a costa de que—. Aca dice que el GMV cae PERO el numero de
# ordenes no: entonces no se fue la demanda, se encogio el ticket, que es
# exactamente lo que el envio gratis puede mover. Si tambien cayeran las
# ordenes, el envio gratis no es la palanca y la regla se calla.
[[rules.gmv_usd_cayendo.guard]]
metric = "orders_by_currency"
where = { "total.currency" = "USD" }
above = 0.9               # el conteo no viene cayendo mas de 10%

[rules.gmv_usd_cayendo.then]
flag = "free_shipping"
variant = "over_500"
restore = "off"           # lo que sube solo tiene que poder bajar solo

# La caché de la respuesta de `getOrderV2`.
#
# No es "otro motor": es una copia derivada, y lo unico dificil es saber cuando
# dejo de ser cierta. Eso axon si lo sabe, porque los eventos estan declarados.
[cache]
engine = "valkey"

[cache.order]
of = "getOrderV2"
# El tenant EN la llave. Sin el, el primer inquilino que pregunta calienta la
# entrada y al siguiente se le sirve la ajena, como acierto: ni el RLS ni el
# router ven esa segunda consulta.
key = ["tenantId", "orderId"]
# Cabe en el `max_staleness_ms` que el servicio ya prometio.
ttl_ms = 2000
# Sin `invalidated_by`, y no por pereza: la llave lleva el inquilino y el unico
# evento que este servicio emite no lo trae, asi que la invalidacion construiria
# una llave con un hueco y no borraria nada. `verify` lo dice con esas palabras
# si se declara. Aqui el TTL es lo unico que la vuelve vieja, y es una decision
# tomada, no un olvido.
# El interruptor: el dia que la invalidacion este mal se apaga sin desplegar, y
# una regla sobre una metrica puede ser la que lo apague.
enabled_by = "cache_orders"

# Interruptor de emergencia: se apaga entero o no sirve, y por eso no lleva
# fecha de caducidad ni despliegue gradual.
[flags.cache_orders]
owner = "orders-team"
kill_switch = true
default = true

# La lista que nadie cree que valga la pena declarar, y que acaba escrita tres
# veces: un enum en el servicio, un CHECK en la migracion y un desplegable en el
# front. El dia que alguien anade un valor, dos de las tres no se enteran.
#
# Declarada es UNA: la tabla, su semilla y un tipo union donde un valor
# inventado no compila. Y anadir uno es un diff que alguien revisa, no un
# INSERT que alguien corrio.
# Los roles y los planes son vocabulario de la plataforma, igual que los scopes:
# lo que axon declara es el NOMBRE, para que un dedazo falle en `verify` en vez
# de ser un 403 que nadie ve en la revision. Que scopes tiene cada rol es
# configuracion mutable del proveedor y NO se declara aqui: seria una segunda
# copia que se queda vieja en silencio.
[catalog.role]
key = "name"
fields = { name = "string", description = "string" }
entries = [
  { name = "admin", description = "Todo" },
  { name = "support", description = "Lee y puede actuar en nombre de un cliente" },
]

[catalog.plan]
key = "code"
fields = { code = "string", name = "string" }
entries = [
  { code = "free", name = "Gratis" },
  { code = "pro", name = "Pro" },
]

[catalog.currency]
key = "code"
fields = { code = "string", name = "string", decimals = "int" }
entries = [
  { code = "MXN", name = "Peso mexicano", decimals = 2 },
  { code = "USD", name = "US Dollar", decimals = 2 },
  { code = "CLP", name = "Peso chileno", decimals = 0 },
]

# Como un llamante se convierte en un principal.
#
# axon no autentica a nadie ni guarda una credencial. Lo que se declara aqui es
# la FORMA que tiene que tener un token verificado, para que el `auth` del edge,
# los `scopes` del metodo y el RLS que el compilador ya genera dejen de ser tres
# esperanzas independientes que casualmente coinciden.
#
# Quien emite el token —better-auth, Auth0, Keycloak, Cognito, treinta lineas de
# jose— es un adaptador, igual que Bus, Cache u Outbox. Aqui no aparece ningun
# proveedor: los nombres de claim son toda la superficie especifica, y son datos.
[auth]
# Una lista y no un valor: lo mas frecuente en la vida de un sistema de auth es
# una migracion, y son semanas aceptando dos.
issuers   = ["https://auth.demo.mx"]
audience  = "orders"
verify    = "jwks"
jwks_uri  = "https://auth.demo.mx/.well-known/jwks.json"
# Lista cerrada: `none` no es verificacion, y un HMAC donde hay un juego de
# claves publicado deja firmar con la clave publica como si fuera el secreto.
algorithms      = ["EdDSA", "ES256"]
clock_skew_s    = 60
revocation      = "eventual"
max_token_age_s = 900
subject_claim = "sub"
tenant_claim  = "org_id"
scopes_claim  = "scope"
roles_claim   = "roles"

# Actuar en nombre de otro. Decide dos cosas: a que inquilino se ata el RLS —al
# del impersonado, o la fila es invisible y el ticket no se puede contestar— y
# si la escritura dice quien lo hizo de verdad.
[auth.impersonation]
claim = "act"
roles = ["support"]
audit = true
