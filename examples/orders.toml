service = "orders"
owner = "equipo-comercio"
tier = "1"
pii = ["customer_email"]
version = "1.0.0"
transport = "pubsub"

[emits."order.placed@v1"]
orderId = "uuid"
customerId = "uuid"
total = "money"

[methods.placeOrder]
http = "POST /v1/orders"
auth = "public"          # la puerta de entrada del sistema
rate_limit = 60          # por minuto: publica sin freno es una invitacion
timeout_ms = 5000
idempotent = true
in = { customerId = "uuid", total = "money" }
out = { orderId = "uuid" }

[methods.getOrder]
http = "GET /v1/orders/{orderId}"
auth = "required"
timeout_ms = 2000
in = { orderId = "uuid" }
out = { orderId = "uuid", status = "string", total = "money" }

[[depends]]
service = "payments"
method = "capturePayment"
timeout_ms = 3000
retries = 2
breaker = true

[infra]
state = "postgres"
tenant_column = "tenant_id"
backup_retention_days = 14
pool_size = 4
max_connections = 100
# Se lee de las replicas, van con retraso, y por eso este servicio se declara
# `eventual`: la garantia y la topologia dicen lo mismo.
read_replicas = 2
migrations = "sql/orders/"
runtime = "container"

[env.staging]
min_instances = 0

[env.prod]
min_instances = 2

# Un catalogo de ordenes aguanta unos segundos de retraso; caerse, no.
[cap]
consistency = "eventual"
on_partition = "degrade"
max_staleness_ms = 3000
