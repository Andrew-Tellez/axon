service = "orders"
owner = "equipo-comercio"
tier = "1"
pii = ["customer_email"]
version = "2.0.0"
transport = "pubsub"

[emits."order.placed@v1"]
orderId = "uuid"
customerId = "uuid"
customerEmail = "string"
total = "money"

# El inquilino va en la ruta, no implicito. Con la base repartida por
# `tenant_id`, una consulta que no lo lleva no se puede rutear a un nodo ni
# aislar del resto: el pooler la rechaza y `axon verify` no la deja llegar ahi.
[methods.placeOrder]
http = "POST /v1/tenants/{tenantId}/orders"
auth = "public"          # la puerta de entrada del sistema
rate_limit = 60          # por minuto: publica sin freno es una invitacion
timeout_ms = 5000
idempotent = true
in = { tenantId = "uuid", customerId = "uuid", customerEmail = "string", total = "money" }
out = { orderId = "uuid" }

[methods.getOrder]
http = "GET /v1/tenants/{tenantId}/orders/{orderId}"
auth = "required"
timeout_ms = 2000
in = { tenantId = "uuid", orderId = "uuid" }
out = { orderId = "uuid", status = "string", total = "money" }

[[depends]]
service = "payments"
method = "capturePayment"
timeout_ms = 3000
retries = 2
breaker = true

# Una bodega es donde un dato personal vive mas tiempo y lo lee mas gente, asi
# que el default es no exportarlo. Aca se elige hashearlo para poder contar
# clientes unicos sin guardar el correo.
[analytics]
pii = "hash"

[infra]
state = "postgres"
tenant_column = "tenant_id"
backup_retention_days = 14
pool_size = 4
max_connections = 100
# Se lee de las replicas, van con retraso, y por eso este servicio se declara
# `eventual`: la garantia y la topologia dicen lo mismo.
read_replicas = 2
shard_key = "tenant_id"
migrations = "sql/orders/"
runtime = "container"

[env.staging]
min_instances = 0

[env.prod]
min_instances = 2

# Un catalogo de ordenes aguanta unos segundos de retraso; caerse, no.
[cap]
consistency = "eventual"
on_partition = "degrade"
max_staleness_ms = 3000

# El sharder va aca y no en payments: repartir con confirmacion en dos fases da
# consistencia eventual, y payments declara `strong`, tier 0 y PITR —tres
# razones por las que `verify` lo rechaza ahi. El dinero no se reparte; el
# catalogo si.
#
# `mode = "transaction"` obliga a declarar como se fija el inquilino: en ese
# modo la conexion vuelve al pool en cada COMMIT y se le entrega a otro, y una
# GUC de sesion que sobreviva devuelve las filas del anterior sin dar error.
[pooler]
engine = "pgdog"
mode = "transaction"
tenant_binding = "set_local"
shards = 4
max_client_conn = 500
pool_size = 40
