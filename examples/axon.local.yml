# generated by axon — do not edit.  docker compose -f axon.local.yml up -d --wait
services:
  broker:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
  db-checkout:
    image: postgres:16-alpine
    # the same ceiling as in production: exhausting connections locally is the
    # only way to find out before it scales
    command: ["postgres", "-c", "max_connections=100"]
    environment: { POSTGRES_DB: checkout, POSTGRES_PASSWORD: local }
    ports: ["${AXON_DB_PORT_checkout:-15734}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
  migrate-db-checkout:
    image: flyway/flyway:10-alpine
    depends_on: { db-checkout: { condition: service_healthy } }
    volumes: ["./sql/checkout:/flyway/sql:ro"]
    command: >
      -url=jdbc:postgresql://db-checkout:5432/checkout
      -user=postgres -password=local -connectRetries=10
      -sqlMigrationPrefix= -sqlMigrationSeparator=_
      -validateMigrationNaming=true
      migrate
  db-orders-0:
    image: postgres:16-alpine
    # the same ceiling as in production: exhausting connections locally is the
    # only way to find out before it scales
    command: ["postgres", "-c", "max_connections=100"]
