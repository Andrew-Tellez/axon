      - traefik.http.services.orders.loadbalancer.server.port=8080
  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    depends_on: { broker: { condition: service_healthy }, traza: { condition: service_healthy }, crear-buckets: { condition: service_completed_successfully }, db-payments: { condition: service_healthy }, policies-db-payments: { condition: service_completed_successfully } }
    ports: ["${AXON_PORT_payments:-8278}:8080"]
    env_file: [.env.local]
    environment:
      AXON_BROKER_URL: nats://broker:4222
      AXON_TRACE_LOG: /out/local.ndjson
      DATABASE_URL: postgres://postgres:local@db-payments:5432/payments
      # STRIPE_API_KEY: comes from .env.local
      AWS_ENDPOINT_URL: http://objetos:9000
      BUCKET_RECIBOS: local-payments-recibos
      BUCKET_ASSETS: local-payments-assets
      AXON_FLAGS_URL: http://flags:8016
      OTEL_SERVICE_NAME: "payments"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://traza:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_RESOURCE_ATTRIBUTES: "service.name=payments,axon.owner=equipo-pagos,axon.tier=0,service.version=1.2.0"
      OTEL_TRACES_SAMPLER: "parentbased_always_on"
    volumes: ["./.axon:/out"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.payments.rule=PathPrefix(`/v1/payments`) || PathPrefix(`/v1/payouts`)
      - traefik.http.services.payments.loadbalancer.server.port=8080
  cron-fotos_compra:
    image: curlimages/curl:8.11.1
    depends_on: { checkout: { condition: service_started } }
    # `while` and not a single `sleep`: a job that runs once and exits leaves
    # `up --wait` counting a container that died
    command: ["sh", "-c", "while :; do sleep 3600; curl -fsS -m 10 -X POST http://checkout:8080/internal/aggregate/compra/prune || true; done"]
  cron-saga_compra:
    image: curlimages/curl:8.11.1
    depends_on: { checkout: { condition: service_started } }
    # `while` and not a single `sleep`: a job that runs once and exits leaves
    # `up --wait` counting a container that died
    command: ["sh", "-c", "while :; do sleep 60; curl -fsS -m 10 -X POST http://checkout:8080/internal/saga/compra/sweep || true; done"]
  warehouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment: { CLICKHOUSE_DB: axon, CLICKHOUSE_USER: local, CLICKHOUSE_PASSWORD: local }
    # The envelope log, where `file()` can read it. NOT read-only: the
    # image's entrypoint `chown`s this directory and with `:ro` that fails
    # and the container does not start.
    volumes: ["./.axon:/var/lib/clickhouse/user_files"]
    ports: ["${AXON_BODEGA_PORT:-8123}:8123"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping"]
      interval: 2s
      retries: 30

# JetStream streams to create at startup:
#   nats stream add compra.cobrada.v1 --subjects compra.cobrada.v1
#   nats stream add compra.compensada.v1 --subjects compra.compensada.v1
#   nats stream add compra.iniciada.v1 --subjects compra.iniciada.v1
#   nats stream add order.placed.v1 --subjects order.placed.v1
#   nats stream add payment.captured.v1 --subjects payment.captured.v1
# the envelope log lands in ./.axon/local.ndjson -> `axon trace .axon/local.ndjson`

