  flags:
    image: ghcr.io/open-feature/flagd:v0.12.9
    command: ["start", "--uri", "file:/etc/flags/flags.json"]
    # 8016 is OFREP, OpenFeature's standard REST protocol
    ports: ["${AXON_FLAGS_PORT:-8016}:8016"]
    volumes: ["./.axon/flags.json:/etc/flags/flags.json:ro"]
  trace:
    image: jaegertracing/all-in-one:1.76.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["${AXON_OTLP_PORT:-4318}:4318", "${AXON_TRACE_UI_PORT:-16686}:16686"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 2s
  objetos:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment: { MINIO_ROOT_USER: local, MINIO_ROOT_PASSWORD: locallocal }
    ports: ["${AXON_S3_PORT:-9000}:9000", "${AXON_S3_CONSOLE_PORT:-9001}:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
  crear-buckets:
    image: minio/mc:latest
    depends_on: { objetos: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "mc alias set local http://objetos:9000 local locallocal && mc mb -p local/local-payments-receipts && mc mb -p local/local-payments-assets"
  edge:
    image: traefik:v3
    command:
      - --providers.docker=true
      # only what declares `traefik.enable`: otherwise it tries to route the
      # migration jobs too and fills the log with "port is missing"
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      # The access log, in JSON and to a file. It is the only place that knows
      # who calls what: a caller outside axon declares nothing, and what it
      # reads of the answer is not observable — but what it ASKS for is right
      # here. `axon traffic --check` reads this and says who still calls a
      # version that is being retired.
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.filepath=/out/log/edge.ndjson
      - --accesslog.fields.headers.names.X-Api-Version=keep
    ports: ["${AXON_EDGE_PORT:-8000}:80"]
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./.axon/log:/out/log"
  checkout:
    build:
      context: .
      dockerfile: services/checkout/Dockerfile
    depends_on: { broker: { condition: service_healthy }, trace: { condition: service_healthy }, db-checkout: { condition: service_healthy }, migrate-db-checkout: { condition: service_completed_successfully } }
    ports: ["${AXON_PORT_checkout:-8201}:8080"]
    env_file: [.env.local]
    environment:
      AXON_BROKER_URL: nats://broker:4222
      AXON_TRACE_LOG: /out/log/local.ndjson
      DATABASE_URL: postgres://postgres:local@db-checkout:5432/checkout
      AXON_FLAGS_URL: http://flags:8016
      OTEL_SERVICE_NAME: "checkout"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://trace:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_RESOURCE_ATTRIBUTES: "service.name=checkout,axon.owner=commerce-team,axon.tier=1,service.version=1.0.0"
      OTEL_TRACES_SAMPLER: "parentbased_always_on"
    volumes: ["./.axon:/out"]
    # The k8s target already probes `/healthz`; here it is what makes `up --wait`
    # actually wait. Without it compose returns as soon as the container STARTS, and
    # the first request lands before the process is listening —a reset that reads as
    # a bug in the service. On a cold start, which is the CI case, it always lost.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      - traefik.enable=true
      - traefik.http.routers.checkout.rule=PathPrefix(`/v1/checkouts`)
      - traefik.http.services.checkout.loadbalancer.server.port=8080
  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    depends_on: { broker: { condition: service_healthy }, trace: { condition: service_healthy }, cache-orders: { condition: service_healthy }, pooler-orders: { condition: service_healthy } }
    ports: ["${AXON_PORT_orders:-8300}:8080"]
    env_file: [.env.local]
    environment:
      AXON_BROKER_URL: nats://broker:4222
      AXON_TRACE_LOG: /out/log/local.ndjson
      DATABASE_URL: postgres://postgres:local@pooler-orders:6432/orders
      AXON_CACHE_URL: redis://cache-orders:6379
      AXON_FLAGS_URL: http://flags:8016
      OTEL_SERVICE_NAME: "orders"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://trace:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_RESOURCE_ATTRIBUTES: "service.name=orders,axon.owner=commerce-team,axon.tier=1,service.version=2.0.0"
      OTEL_TRACES_SAMPLER: "parentbased_always_on"
    volumes: ["./.axon:/out"]
    # The k8s target already probes `/healthz`; here it is what makes `up --wait`
    # actually wait. Without it compose returns as soon as the container STARTS, and
    # the first request lands before the process is listening —a reset that reads as
    # a bug in the service. On a cold start, which is the CI case, it always lost.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      - traefik.enable=true
      - traefik.http.routers.orders.rule=PathPrefix(`/v1/tenants`) || PathPrefix(`/v2/tenants`)
      - traefik.http.services.orders.loadbalancer.server.port=8080
      - traefik.http.routers.orders.middlewares=orders-rl
      # `average` per minute, which is the unit `rate_limit` is declared in.
      # The burst is a tenth: without one, traffic that is not perfectly
      # smooth gets throttled below its own declared limit.
      - traefik.http.middlewares.orders-rl.ratelimit.average=60
      - traefik.http.middlewares.orders-rl.ratelimit.period=1m
      - traefik.http.middlewares.orders-rl.ratelimit.burst=6
  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    depends_on: { broker: { condition: service_healthy }, trace: { condition: service_healthy }, crear-buckets: { condition: service_completed_successfully }, db-payments: { condition: service_healthy }, policies-db-payments: { condition: service_completed_successfully } }
    ports: ["${AXON_PORT_payments:-8278}:8080"]
    env_file: [.env.local]
    environment:
      AXON_BROKER_URL: nats://broker:4222
      AXON_TRACE_LOG: /out/log/local.ndjson
      DATABASE_URL: postgres://postgres:local@db-payments:5432/payments
      # STRIPE_API_KEY: comes from .env.local
      AWS_ENDPOINT_URL: http://objetos:9000
      BUCKET_RECEIPTS: local-payments-receipts
      BUCKET_ASSETS: local-payments-assets
      AXON_FLAGS_URL: http://flags:8016
      OTEL_SERVICE_NAME: "payments"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://trace:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_RESOURCE_ATTRIBUTES: "service.name=payments,axon.owner=payments-team,axon.tier=0,service.version=1.2.0"
      OTEL_TRACES_SAMPLER: "parentbased_always_on"
    volumes: ["./.axon:/out"]
    # The k8s target already probes `/healthz`; here it is what makes `up --wait`
    # actually wait. Without it compose returns as soon as the container STARTS, and
    # the first request lands before the process is listening —a reset that reads as
    # a bug in the service. On a cold start, which is the CI case, it always lost.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      - traefik.enable=true
      - traefik.http.routers.payments.rule=PathPrefix(`/v1/payments`) || PathPrefix(`/v1/payouts`)
      - traefik.http.services.payments.loadbalancer.server.port=8080
  cron-snapshots_checkout:
    image: curlimages/curl:8.11.1
    depends_on: { checkout: { condition: service_started } }
    # `while` and not a single `sleep`: a job that runs once and exits leaves
    # `up --wait` counting a container that died
    command: ["sh", "-c", "while :; do sleep 3600; curl -fsS -m 10 -X POST http://checkout:8080/internal/aggregate/checkout/prune || true; done"]
  cron-saga_checkout:
    image: curlimages/curl:8.11.1
    depends_on: { checkout: { condition: service_started } }
    # `while` and not a single `sleep`: a job that runs once and exits leaves
    # `up --wait` counting a container that died
    command: ["sh", "-c", "while :; do sleep 60; curl -fsS -m 10 -X POST http://checkout:8080/internal/saga/checkout/sweep || true; done"]
  cache-orders:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports: ["${AXON_CACHE_PORT_orders:-16399}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
  warehouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment: { CLICKHOUSE_DB: axon, CLICKHOUSE_USER: local, CLICKHOUSE_PASSWORD: local }
    # ONLY the log's subdirectory, and not `.axon` itself. The image's
    # entrypoint `chown`s user_files —with `:ro` it fails and the container
    # does not start— so whatever is mounted there changes owner. With
    # `./.axon` there, on Linux every file the demo writes afterwards failed
    # with `Permission denied`; on Docker Desktop it did not, because the
    # chown does not reach the host.
    volumes: ["./.axon/log:/var/lib/clickhouse/user_files"]
    ports: ["${AXON_WAREHOUSE_PORT:-8123}:8123"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping"]
      interval: 2s
      retries: 30
  bi:
    image: metabase/metabase:v0.56.11
    depends_on: { warehouse: { condition: service_healthy } }
    environment: { MB_ANON_TRACKING_ENABLED: "false" }
    # 3030 and not Metabase's 3000: that port is taken on any machine
    # with a dev server running, and a demo that fails to bind reads as
    # the demo being broken
    ports: ["${AXON_BI_PORT:-3030}:3000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      retries: 40

# JetStream streams to create at startup:
#   nats stream add checkout.charged.v1 --subjects checkout.charged.v1
#   nats stream add checkout.compensated.v1 --subjects checkout.compensated.v1
#   nats stream add checkout.started.v1 --subjects checkout.started.v1
#   nats stream add order.placed.v1 --subjects order.placed.v1
#   nats stream add payment.captured.v1 --subjects payment.captured.v1
# the envelope log lands in ./.axon/local.ndjson -> `axon trace .axon/local.ndjson`

