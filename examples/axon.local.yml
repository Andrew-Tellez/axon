      migrate
  pooler-orders:
    # Pinned by digest: pgdog only publishes the `main` tag, which moves. A
    # moving tag in a generated file changes the binary without changing the diff.
    image: ghcr.io/pgdogdev/pgdog:main@sha256:16c85d1c6471de9aefbb2eceae1c48080786d74f9aa8bcadd32fe183c26184a3
    depends_on: { policies-db-orders-0: { condition: service_completed_successfully }, policies-db-orders-1: { condition: service_completed_successfully }, policies-db-orders-2: { condition: service_completed_successfully }, policies-db-orders-3: { condition: service_completed_successfully } }
    # the image's workdir is /pgdog, that is where it reads its config from
    volumes: ["./.axon/pgdog/orders:/pgdog:ro"]
    ports: ["${AXON_POOLER_PORT_orders:-16814}:6432"]
    healthcheck:
      # against the pooler, not against a node: it checks that pgdog speaks the
      # protocol, which is the only thing the service will ever see
      test: ["CMD-SHELL", "PGPASSWORD=local psql -h 127.0.0.1 -p 6432 -U postgres -d orders -c 'select 1' >/dev/null"]
      interval: 2s
      retries: 30
  db-payments:
    image: postgres:16-alpine
    # the same ceiling as in production: exhausting connections locally is the
    # only way to find out before it scales
    command: ["postgres", "-c", "max_connections=200"]
    environment: { POSTGRES_DB: payments, POSTGRES_PASSWORD: local }
    ports: ["${AXON_DB_PORT_payments:-15729}:5432"]
    healthcheck:
