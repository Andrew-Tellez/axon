  flags:
    image: ghcr.io/open-feature/flagd:v0.12.9
    command: ["start", "--uri", "file:/etc/flags/flags.json"]
    # 8016 is OFREP, OpenFeature's standard REST protocol
    ports: ["${AXON_FLAGS_PORT:-8016}:8016"]
    volumes: ["./.axon/flags.json:/etc/flags/flags.json:ro"]
  traza:
    image: jaegertracing/all-in-one:1.76.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["${AXON_OTLP_PORT:-4318}:4318", "${AXON_TRAZA_UI_PORT:-16686}:16686"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 2s
  objetos:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment: { MINIO_ROOT_USER: local, MINIO_ROOT_PASSWORD: locallocal }
    ports: ["${AXON_S3_PORT:-9000}:9000", "${AXON_S3_CONSOLE_PORT:-9001}:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
  crear-buckets:
    image: minio/mc:latest
    depends_on: { objetos: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "mc alias set local http://objetos:9000 local locallocal && mc mb -p local/local-payments-recibos && mc mb -p local/local-payments-assets"
  edge:
    image: traefik:v3
    command:
      - --providers.docker=true
      # only what declares `traefik.enable`: otherwise it tries to route the
      # migration jobs too and fills the log with "port is missing"
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
    ports: ["${AXON_EDGE_PORT:-8000}:80"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
  checkout:
    build:
      context: .
      dockerfile: services/checkout/Dockerfile
    depends_on: { broker: { condition: service_healthy }, traza: { condition: service_healthy }, db-checkout: { condition: service_healthy }, migrate-db-checkout: { condition: service_completed_successfully } }
    ports: ["${AXON_PORT_checkout:-8201}:8080"]
    env_file: [.env.local]
    environment:
      AXON_BROKER_URL: nats://broker:4222
      AXON_TRACE_LOG: /out/local.ndjson
      DATABASE_URL: postgres://postgres:local@db-checkout:5432/checkout
      AXON_FLAGS_URL: http://flags:8016
      OTEL_SERVICE_NAME: "checkout"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://traza:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_RESOURCE_ATTRIBUTES: "service.name=checkout,axon.owner=equipo-comercio,axon.tier=1,service.version=1.0.0"
      OTEL_TRACES_SAMPLER: "parentbased_always_on"
    volumes: ["./.axon:/out"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.checkout.rule=PathPrefix(`/v1/checkouts`)
      - traefik.http.services.checkout.loadbalancer.server.port=8080
  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    depends_on: { broker: { condition: service_healthy }, traza: { condition: service_healthy }, pooler-orders: { condition: service_healthy } }
    ports: ["${AXON_PORT_orders:-8300}:8080"]
    env_file: [.env.local]
    environment:
      AXON_BROKER_URL: nats://broker:4222
      AXON_TRACE_LOG: /out/local.ndjson
      DATABASE_URL: postgres://postgres:local@pooler-orders:6432/orders
      AXON_FLAGS_URL: http://flags:8016
      OTEL_SERVICE_NAME: "orders"
