      -baselineOnMigrate=true
      -sqlMigrationPrefix= -sqlMigrationSeparator=_
      -validateMigrationNaming=true
      migrate
  pooler-orders:
    # Fijado por digest: pgdog solo publica el tag `main`, que se mueve. Un tag
    # movil en un archivo generado cambia el binario sin cambiar el diff.
    image: ghcr.io/pgdogdev/pgdog:main@sha256:16c85d1c6471de9aefbb2eceae1c48080786d74f9aa8bcadd32fe183c26184a3
    depends_on: { policies-db-orders-0: { condition: service_completed_successfully }, policies-db-orders-1: { condition: service_completed_successfully }, policies-db-orders-2: { condition: service_completed_successfully }, policies-db-orders-3: { condition: service_completed_successfully } }
    # el workdir de la imagen es /pgdog, de ahi lee su configuracion
    volumes: ["./.axon/pgdog/orders:/pgdog:ro"]
    ports: ["${AXON_POOLER_PORT_orders:-16432}:6432"]
    healthcheck:
      # contra el pooler, no contra un nodo: comprueba que pgdog acepta el
      # protocolo, que es lo unico que el servicio va a ver
      test: ["CMD-SHELL", "PGPASSWORD=local psql -h 127.0.0.1 -p 6432 -U postgres -d orders -c 'select 1' >/dev/null"]
      interval: 2s
      retries: 30
  db-payments:
    image: postgres:16-alpine
    # el mismo tope que en produccion: agotar conexiones en local es la unica
    # forma de descubrirlo antes de que escale
    command: ["postgres", "-c", "max_connections=200"]
    environment: { POSTGRES_DB: payments, POSTGRES_PASSWORD: local }
    ports: ["${AXON_DB_PORT_payments:-15436}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
  migrate-db-payments:
    image: flyway/flyway:10-alpine
    depends_on: { db-payments: { condition: service_healthy } }
    volumes: ["./sql/payments:/flyway/sql:ro"]
    command: >
      -url=jdbc:postgresql://db-payments:5432/payments
      -user=postgres -password=local -connectRetries=10
      -sqlMigrationPrefix= -sqlMigrationSeparator=_
      -validateMigrationNaming=true
      migrate
  policies-db-payments:
    image: flyway/flyway:10-alpine
    depends_on: { migrate-db-payments: { condition: service_completed_successfully } }
    volumes: ["./sql-policies/payments:/flyway/sql:ro"]
    # `baselineOnMigrate`: este historial es el SEGUNDO sobre un esquema que ya
    # tiene tablas, las creo el otro. Sin eso Flyway se niega a inicializarse
    # sobre un esquema no vacio, que es la situacion normal aca. Y el comentario
    # va ACA y no dentro del bloque `>`: ahi dentro un `#` es texto, y termina
    # siendo un argumento de Flyway.
    command: >
      -url=jdbc:postgresql://db-payments:5432/payments
      -user=postgres -password=local -connectRetries=10
      -table=axon_policies_history
      -baselineOnMigrate=true
      -sqlMigrationPrefix= -sqlMigrationSeparator=_
      -validateMigrationNaming=true
      migrate
  flags:
    image: ghcr.io/open-feature/flagd:v0.12.9
    command: ["start", "--uri", "file:/etc/flags/flags.json"]
    # 8016 es OFREP, el protocolo REST estandar de OpenFeature
    ports: ["${AXON_FLAGS_PORT:-8016}:8016"]
    volumes: ["./.axon/flags.json:/etc/flags/flags.json:ro"]
  traza:
    image: jaegertracing/all-in-one:1.76.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["${AXON_OTLP_PORT:-4318}:4318", "${AXON_TRAZA_UI_PORT:-16686}:16686"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 2s
  objetos:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment: { MINIO_ROOT_USER: local, MINIO_ROOT_PASSWORD: locallocal }
    ports: ["${AXON_S3_PORT:-9000}:9000", "${AXON_S3_CONSOLE_PORT:-9001}:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
  crear-buckets:
    image: minio/mc:latest
    depends_on: { objetos: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "mc alias set local http://objetos:9000 local locallocal && mc mb -p local/local-payments-recibos && mc mb -p local/local-payments-assets"
  edge:
    image: traefik:v3
    command:
      - --providers.docker=true
      # solo lo que declara `traefik.enable`: si no, intenta rutear tambien los
      # jobs de migracion y llena el log de "port is missing"
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
    ports: ["${AXON_EDGE_PORT:-8000}:80"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    depends_on: { broker: { condition: service_healthy }, traza: { condition: service_healthy }, pooler-orders: { condition: service_healthy } }
    ports: ["${AXON_PORT_orders:-8080}:8080"]
    env_file: [.env.local]
    environment:
      AXON_BROKER_URL: nats://broker:4222
      AXON_TRACE_LOG: /out/local.ndjson
      DATABASE_URL: postgres://postgres:local@pooler-orders:6432/orders
      AXON_FLAGS_URL: http://flags:8016
      OTEL_SERVICE_NAME: "orders"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://traza:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_RESOURCE_ATTRIBUTES: "service.name=orders,axon.owner=equipo-comercio,axon.tier=1,service.version=2.0.0"
      OTEL_TRACES_SAMPLER: "parentbased_always_on"
    volumes: ["./.axon:/out"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.orders.rule=PathPrefix(`/v1/tenants`)
      - traefik.http.services.orders.loadbalancer.server.port=8080
  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    depends_on: { broker: { condition: service_healthy }, traza: { condition: service_healthy }, crear-buckets: { condition: service_completed_successfully }, db-payments: { condition: service_healthy }, policies-db-payments: { condition: service_completed_successfully } }
    ports: ["${AXON_PORT_payments:-8081}:8080"]
    env_file: [.env.local]
    environment:
      AXON_BROKER_URL: nats://broker:4222
      AXON_TRACE_LOG: /out/local.ndjson
      DATABASE_URL: postgres://postgres:local@db-payments:5432/payments
      # STRIPE_API_KEY: viene de .env.local
      AWS_ENDPOINT_URL: http://objetos:9000
      BUCKET_RECIBOS: local-payments-recibos
      BUCKET_ASSETS: local-payments-assets
      AXON_FLAGS_URL: http://flags:8016
      OTEL_SERVICE_NAME: "payments"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://traza:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_RESOURCE_ATTRIBUTES: "service.name=payments,axon.owner=equipo-pagos,axon.tier=0,service.version=1.2.0"
      OTEL_TRACES_SAMPLER: "parentbased_always_on"
    volumes: ["./.axon:/out"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.payments.rule=PathPrefix(`/v1/payments`)
      - traefik.http.services.payments.loadbalancer.server.port=8080

# streams JetStream a crear al arrancar:
#   nats stream add order.placed.v1 --subjects order.placed.v1
#   nats stream add payment.captured.v1 --subjects payment.captured.v1
# el log de envelopes cae en ./.axon/local.ndjson -> `axon trace .axon/local.ndjson`

