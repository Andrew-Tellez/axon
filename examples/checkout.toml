service = "checkout"
owner = "equipo-comercio"
tier = "1"
version = "1.0.0"
transport = "pubsub"

# El unico metodo: arranca la saga. Todo lo demas lo hace el coordinador
# generado.
[methods.checkout]
http = "POST /v1/checkouts"
auth = "required"
timeout_ms = 30000
idempotent = true
in = { orderId = "uuid", amount = "money" }
out = { estado = "string" }

# Cobrar y despues pagarle al comercio son dos efectos en dos sistemas. No hay
# transaccion que los cubra: si el segundo falla, el primero hay que deshacerlo.
#
# El presupuesto cubre la suma de los pasos CON sus reintentos: 8000 + 8000x4
# + 4000x3 = 52000. Son cuatro intentos y no tres, porque `retries = 3` son
# tres REintentos ademas del primero —`axon verify` hizo la cuenta y corrigio la
# que estaba escrita aqui—. Rendirse antes dejaria al coordinador compensando
# algo que despues tiene exito.
[saga.compra]
on = "checkout"
timeout_ms = 60000
steps = [
  { do = "payments.capturePayment", undo = "payments.refundPayment" },
  { do = "payments.payoutMerchant" },
]

# El historial de una compra: el estado ES esta secuencia. La fila de
# `vista_conversion` es una proyeccion de esto, no la verdad.
[emits."compra.iniciada@v1"]
streamId = "uuid"
orderId = "uuid"
amount = "money"

[emits."compra.cobrada@v1"]
streamId = "uuid"
paymentId = "uuid"

[emits."compra.compensada@v1"]
streamId = "uuid"
motivo = "string"

[aggregate.compra]
events = ["compra.iniciada@v1", "compra.cobrada@v1", "compra.compensada@v1"]
# Cada 2 eventos. En un agregado real seria 50 o 100; aca es 2 para que el demo
# ejercite la foto con una sola compra.
snapshot_every = 2
# La version de las REGLAS. Subirla invalida las fotos existentes: una foto
# calculada con reglas viejas da un estado que ya no coincide con reproducir el
# flujo, y eso no da error, da un numero equivocado.
snapshot_version = 1

# El traspaso al bus, en la misma transaccion que el append. `verify` lo exige
# para un agregado cuyos eventos se publican: el flujo ya es durable, asi que
# publicar en linea deja una ventana en la que el evento esta anotado y nadie lo
# recibio.
[patterns]
outbox = true

# El modelo de lectura. Se llena DESPUES de que el evento ocurrio, asi que su
# atraso tiene que caber en el presupuesto que el servicio ya declaro (5000ms).
[view.conversion]
on = ["compra.iniciada@v1", "compra.cobrada@v1", "compra.compensada@v1"]
max_staleness_ms = 3000

[[depends]]
service = "payments"
method = "capturePayment"
timeout_ms = 8000
breaker = true

[[depends]]
service = "payments"
method = "refundPayment"
# La compensacion se reintenta mas que el paso: es el ultimo recurso, no hay
# nada detras de ella.
timeout_ms = 8000
retries = 3
breaker = true

[[depends]]
service = "payments"
method = "payoutMerchant"
timeout_ms = 4000
# Idempotente, asi que reintentar es legal: `axon verify` bloquea los
# reintentos sobre lo que no lo es. El demo mide que sean exactamente estos.
retries = 2
breaker = true

# La bodega es una decision de plataforma: `verify` exige que los tres
# servicios declaren la misma, porque un embudo repartido entre dos bodegas no
# se puede armar con una consulta.
[analytics]
warehouse = "clickhouse"

[infra]
state = "postgres"
# El diario del coordinador NO se reparte por inquilino: el barrido tiene que
# poder mirar todas las sagas colgadas de una vez, y una consulta sin la clave
# de reparto no se puede rutear. El inquilino viaja dentro de `datos`.
migrations = "sql/checkout/"
runtime = "container"
backup_retention_days = 7
pool_size = 4
max_connections = 100
min_instances = 1
port = 8080

# Una saga es consistencia eventual por construccion: entre cobrar y pagarle al
# comercio el sistema esta en un estado que ningun invariante describe.
[cap]
consistency = "eventual"
on_partition = "reject"
max_staleness_ms = 5000

[env.prod]
min_instances = 2
