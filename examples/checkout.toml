service = "checkout"
owner = "commerce-team"
tier = "1"
version = "1.0.0"
transport = "pubsub"

# The only method: it starts the saga. Everything else is done by the generated
# coordinator.
[methods.checkout]
http = "POST /v1/checkouts"
auth = "required"
# El checkout cobra: exige lo mismo que cobrar, no menos.
scopes = ["payments:write"]
timeout_ms = 30000
idempotent = true
in = { orderId = "uuid", amount = "money" }
out = { state = "string" }
# The saga's own failure. It is a 500 because it IS ours: a compensation that
# did not get through leaves money charged with nothing behind it, and it is not
# retriable because retrying the checkout would charge again —what unsticks it
# is the sweep, not the caller.
errors = [
  { code = "saga_stuck", status = 500, detail = "the compensation did not get through; the sweep takes it from here" },
]

# Charging and then paying the merchant are two effects in two systems. There is
# no transaction that covers both: if the second one fails, the first has to be
# undone.
#
# The budget covers the sum of the steps WITH their retries: 8000 + 8000x4 +
# 4000x3 = 52000. That is four attempts and not three, because `retries = 3` is
# three REtries on top of the first one —`axon verify` did the arithmetic and
# corrected the number that used to be written here. Giving up sooner would
# leave the coordinator compensating something that later succeeds.
[saga.checkout]
on = "checkout"
timeout_ms = 60000
steps = [
  { do = "payments.capturePayment", undo = "payments.refundPayment" },
  { do = "payments.payoutMerchant" },
]

# A checkout's history: the state IS this sequence. The row in `view_conversion`
# is a projection of this, not the truth.
[emits."checkout.started@v1"]
streamId = "uuid"
orderId = "uuid"
amount = "money"

[emits."checkout.charged@v1"]
streamId = "uuid"
paymentId = "uuid"

[emits."checkout.compensated@v1"]
streamId = "uuid"
reason = "string"

[aggregate.checkout]
events = ["checkout.started@v1", "checkout.charged@v1", "checkout.compensated@v1"]
# Every 2 events. In a real aggregate this would be 50 or 100; here it is 2 so
# the demo exercises the snapshot with a single checkout.
snapshot_every = 2
# The version of the RULES. Bumping it invalidates the existing snapshots: a
# snapshot computed with old rules gives a state that no longer matches replaying
# the stream, and that raises no error, it gives a wrong number.
snapshot_version = 1

# The handover to the bus, in the same transaction as the append. `verify`
# requires it for an aggregate whose events get published: the stream is already
# durable, so publishing inline leaves a window where the event is recorded and
# nobody received it.
[patterns]
outbox = true

# The read model. It is filled AFTER the event happened, so its lag has to fit
# inside the budget the service already declared (5000ms).
[view.conversion]
on = ["checkout.started@v1", "checkout.charged@v1", "checkout.compensated@v1"]
max_staleness_ms = 3000

[[depends]]
service = "payments"
method = "capturePayment"
timeout_ms = 8000
breaker = true
# La saga guarda el paymentId para compensar con el: es lo unico que lee.
uses = ["paymentId"]

[[depends]]
service = "payments"
method = "refundPayment"
# The compensation is retried more than the step: it is the last resort, there
# is nothing behind it.
timeout_ms = 8000
retries = 3
breaker = true
# Una lista vacia tambien es una declaracion: de la respuesta no lee nada, que
# es la verdad de una compensacion. Sin esto, `paymentId` y `status` figuran
# como leidos por alguien y nadie puede tocarlos.
uses = []

[[depends]]
service = "payments"
method = "payoutMerchant"
uses = []
timeout_ms = 4000
# Idempotent, so retrying is legal: `axon verify` blocks retries over what is
# not. The demo measures that they are exactly these.
retries = 2
breaker = true

# The warehouse is a platform decision: `verify` requires all three services to
# declare the same one, because a funnel split across two warehouses cannot be
# assembled with one query.
# El catalogo de la plataforma. Un scope con un error de dedo es un 403 en
# produccion que nadie ve en una revision, y la unica forma de atraparlo antes
# es que la lista de lo que existe este en algun lado.
[api]
scopes = ["orders:read", "payments:write"]

[analytics]
warehouse = "clickhouse"
retention_days = 365

[infra]
state = "postgres"
# The coordinator's journal is NOT sharded by tenant: the sweep has to be able
# to look at every stranded saga at once, and a query without the shard key
# cannot be routed. The tenant travels inside `data`.
migrations = "sql/checkout/"
runtime = "container"
backup_retention_days = 7
pool_size = 4
max_connections = 100
min_instances = 1
port = 8080

# A saga is eventual consistency by construction: between charging and paying the
# merchant the system is in a state no invariant describes.
[cap]
consistency = "eventual"
on_partition = "reject"
max_staleness_ms = 5000

[env.prod]
min_instances = 2

# Como un llamante se convierte en un principal.
#
# axon no autentica a nadie ni guarda una credencial. Lo que se declara aqui es
# la FORMA que tiene que tener un token verificado, para que el `auth` del edge,
# los `scopes` del metodo y el RLS que el compilador ya genera dejen de ser tres
# esperanzas independientes que casualmente coinciden.
#
# Quien emite el token —better-auth, Auth0, Keycloak, Cognito, treinta lineas de
# jose— es un adaptador, igual que Bus, Cache u Outbox. Aqui no aparece ningun
# proveedor: los nombres de claim son toda la superficie especifica, y son datos.
[auth]
# Una lista y no un valor: lo mas frecuente en la vida de un sistema de auth es
# una migracion, y son semanas aceptando dos.
issuers   = ["https://auth.demo.mx"]
audience  = "checkout"
verify    = "jwks"
jwks_uri  = "https://auth.demo.mx/.well-known/jwks.json"
# Lista cerrada: `none` no es verificacion, y un HMAC donde hay un juego de
# claves publicado deja firmar con la clave publica como si fuera el secreto.
algorithms      = ["EdDSA", "ES256"]
clock_skew_s    = 60
revocation      = "eventual"
max_token_age_s = 900
subject_claim = "sub"
tenant_claim  = "org_id"
scopes_claim  = "scope"
roles_claim   = "roles"
