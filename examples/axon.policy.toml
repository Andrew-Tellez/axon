# The team's governance, versioned. `axon verify` applies it.
require_owner = true
require_tier = true
# The domain catalogue. Adding one is a decision reviewed in a PR, which is
# exactly the point: without the list, every service invents its own prefix and
# in a year nobody knows which domains exist.
allowed_event_prefixes = ["order", "payment", "billing", "checkout"]
max_deps_per_service = 7

# The repo layout belongs to the team, not to axon. `{service}` is substituted.
[ci]
manifests_dir  = "."
service_dir    = "services/{service}"
test_cmd       = "node --test services/{service}"
contracts_path = "services/{service}/contracts.ts"
