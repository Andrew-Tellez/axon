name: pages
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml", "CHANGELOG.md"]
  # A tag cannot deploy: the `github-pages` environment only allows the default
  # branch. `workflow_run` runs in main's context, so the new version gets
  # published as soon as the release finishes.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the tags are the source of the versions
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: mdbook }
      - uses: actions/configure-pages@v5

      # The site is rebuilt whole from git on every deploy: the root is `main`
      # and each tag lives under its own prefix. No external state, no gh-pages
      # branch to drift.
      - name: assemble the site with every version
        run: |
          set -eu
          mdbook build docs
          mkdir -p site
          cp -R docs/book/. site/
          versions=""
          trabajo=$(mktemp -d)
          for tag in $(git tag -l 'v*' --sort=-v:refname); do
            # a version from before mdBook served a loose index.html: it gets
            # copied as-is instead of trying to build it
            if git cat-file -e "$tag:docs/book.toml" 2>/dev/null; then
              rm -rf "$trabajo/docs"
              git archive "$tag" docs | tar -x -C "$trabajo"
              mdbook build "$trabajo/docs"
              mkdir -p "site/$tag"
              cp -R "$trabajo/docs/book/." "site/$tag/"
            elif git cat-file -e "$tag:docs/index.html" 2>/dev/null; then
              mkdir -p "site/$tag"
              git archive "$tag" docs | tar -x --strip-components=1 -C "site/$tag"
            else
              continue
            fi
            versions="$versions \"$tag\","
            echo "  $tag"
          done
          printf '{"current":"main","versions":[%s]}\n' \
            "\"main\",${versions%,}" | sed 's/,]/]/' > site/versions.json
          cat site/versions.json

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
        id: pages
