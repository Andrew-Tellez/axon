name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: npm ci --prefix examples/services || npm i --prefix examples/services
      # the external validators of the suite: mermaid, redocly and flagd's
      # schema. Without them those tests SKIP, and a test that always skips is
      # one nobody is running and everybody believes
      - run: npm ci --prefix tests/js || npm i --prefix tests/js
      - run: cargo test --release
      # axon verifies itself: its own examples pass its own rules
      - run: cargo run --release -- verify examples

  e2e:
    # The proof none of the others can give: the system really comes up and its
    # real causal chain matches the one the manifest declares.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: ./demo.sh
        working-directory: examples

  wasm:
    # The playground is the compiler itself, so what breaks it is a rule that
    # starts reading the disk —there is none in a browser. That shows up here,
    # on the change, and not in a Pages deploy after the merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "wasm32-unknown-unknown" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib --target wasm32-unknown-unknown --no-default-features --features wasm

  commits:
    # The convention is checked only over the range this push or this PR brings:
    # the history from before adopting it is not conventional, and rewriting it in
    # a public repo to satisfy a linter is worse than the inconsistency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: taiki-e/install-action@v2
        with: { tool: cocogitto }
      - name: check this change's messages
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            desde="${{ github.event.pull_request.base.sha }}"
          else
            desde="${{ github.event.before }}"
          fi
          # the first push to a branch brings zeros as `before`
          case "$desde" in
            ""|0000000000000000000000000000000000000000)
              echo "no previous range: there is nothing to check"; exit 0 ;;
          esac
          cog check "$desde..${{ github.sha }}"
