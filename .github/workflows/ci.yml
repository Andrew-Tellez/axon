name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: npm ci --prefix examples/services || npm i --prefix examples/services
      - run: cargo test --release
      # axon se verifica a si mismo: sus propios ejemplos pasan sus propias reglas
      - run: cargo run --release -- verify examples

  e2e:
    # La prueba que ninguna de las otras puede dar: el sistema levanta de verdad
    # y su cadena causal real coincide con la que declara el manifiesto.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: ./demo.sh
        working-directory: examples

  commits:
    # La convencion se verifica solo en el rango que trae este push o este PR:
    # la historia anterior a adoptarla no es convencional, y reescribirla en un
    # repo publico para satisfacer un linter es peor que la inconsistencia.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: taiki-e/install-action@v2
        with: { tool: cocogitto }
      - name: verificar los mensajes de este cambio
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            desde="${{ github.event.pull_request.base.sha }}"
          else
            desde="${{ github.event.before }}"
          fi
          # el primer push a una rama trae ceros como `before`
          case "$desde" in
            ""|0000000000000000000000000000000000000000)
              echo "sin rango previo: no hay nada que verificar"; exit 0 ;;
          esac
          cog check "$desde..${{ github.sha }}"
