[package]
name = "axon"
version = "0.1.0"
edition = "2021"
description = "Compilador manifiesto-primero para microservicios event-driven"
repository = "https://github.com/Andrew-Tellez/axon"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
