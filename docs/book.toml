[book]
title = "axon"
description = "Manifest-first compiler for event-driven microservices"
authors = ["Andrew Tellez"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/Andrew-Tellez/axon"
edit-url-template = "https://github.com/Andrew-Tellez/axon/edit/main/docs/{path}"
additional-js = ["versions.js"]
additional-css = ["axon.css"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
