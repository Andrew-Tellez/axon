# Convención de commits: Conventional Commits, verificada por cocogitto.
# La misma que `patterns`, para no tener dos convenciones entre repos.
#
# `cog bump --auto` lee los commits desde el último tag, decide si el salto es
# patch, minor o major, mueve la versión del binario, commitea y tagea. Ese tag
# dispara el release. La sección del CHANGELOG se escribe a mano.
tag_prefix = "v"
from_latest_tag = false
ignore_merge_commits = true
ignore_fixup_commits = true
# El changelog se escribe a mano: es prosa curada que explica POR QUE cambio algo,
# no la lista de commits, y el formato Keep a Changelog no es el que cog escribe.
# cog sigue decidiendo el salto de version y el tag.
disable_changelog = true
disable_bump_commit = false
branch_whitelist = ["main"]
skip_ci = "[skip ci]"
skip_untracked = false

# La version del binario es parte del release: sin esto `cog bump` tagea v0.2.0
# y `axon --version` sigue contestando la anterior, que es la clase de deriva
# que este proyecto persigue en todo lo demas. El `cargo build` esta para que
# Cargo.lock quede en el mismo commit que Cargo.toml.
pre_bump_hooks = [
  "sed -i.bak 's/^version = \"[^\"]*\"/version = \"{{version}}\"/' Cargo.toml",
  "rm -f Cargo.toml.bak",
  "cargo build --release",
  "git add Cargo.toml Cargo.lock",
]

# El hook rechaza el commit antes de crearlo: `cog install-hook --all`.
[git_hooks.commit-msg]
script = """#!/bin/sh
set -eu
cog verify --file "$1" --ignore-merge-commits --ignore-fixup-commits
"""

[changelog]
path = "CHANGELOG.md"
authors = []

# Tipos propios además de los del estándar. `feat` y `fix` mueven la versión;
# el resto solo aparece en el changelog, que es lo correcto: cambiar la
# documentación no es una versión nueva del binario.
[commit_types]
gen = { changelog_title = "Generadores" }
infra = { changelog_title = "Infraestructura" }
sec = { changelog_title = "Seguridad" }
